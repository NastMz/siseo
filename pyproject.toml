[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siseo"
version = "1.0.0"
description = "Siseo: a voice-controlled Snake driven by an explainable FFT band-energy command recognizer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Martinez" }]
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.5",
  "PySide6==6.12.0",
  "sounddevice==0.5.6",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: X11 Applications :: Qt",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Games/Entertainment :: Arcade",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-qt==4.5.0",
  "pip-audit==2.10.1",
]

[project.scripts]
siseo-cli = "siseo.cli:main"

[project.gui-scripts]
siseo = "siseo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
